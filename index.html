<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaStore - Premium E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="app.navigate('home')">
                <i class="fa-solid fa-layer-group"></i> AlphaStore
            </div>
            <div class="nav-links">
                <a href="#" onclick="app.navigate('home')">Home</a>
                <a href="#" onclick="app.navigate('cart')" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                    <span id="cart-count" class="cart-count">0</span>
                </a>
                <div id="auth-links">
                    <!-- Dynamic Auth Links -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-container" class="container">
        <!-- Views will be injected here -->
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
